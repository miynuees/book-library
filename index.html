<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>내 서재</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EE;
    --paper:#FFFFFF;
    --lilac:#C9B6E4;
    --lilac-dark:#8E6FBE;
    --peach:#FFC9A8;
    --peach-dark:#FF9459;
    --ink:#4A3F55;
    --muted:#9B8FA8;
    --line:#EEE3F0;
    --green:#9FCBA0;
    --green-dark:#5E9E63;
    --shadow:0 6px 20px rgba(142,111,190,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:linear-gradient(160deg,#FBF6EE 0%,#F6EEFA 100%);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Gowun Batang',serif;}
  [hidden]{display:none!important;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea,select{font-family:inherit;}

  /* ---------- 게이트 화면 ---------- */
  #gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gate-card{
    background:var(--paper);border-radius:28px;box-shadow:var(--shadow);
    padding:44px 36px;max-width:400px;width:100%;text-align:center;
  }
  .gate-card .icon{font-size:48px;margin-bottom:8px;}
  .gate-card h1{font-size:26px;margin:4px 0 6px;}
  .gate-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px;}
  .gate-card input{
    width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);
    font-size:16px;text-align:center;outline:none;transition:border .15s;
  }
  .gate-card input:focus{border-color:var(--lilac);}
  .gate-card button{
    width:100%;margin-top:14px;padding:14px;border-radius:16px;font-size:16px;font-weight:700;
    background:linear-gradient(135deg,var(--lilac),var(--lilac-dark));color:#fff;
    box-shadow:0 6px 16px rgba(142,111,190,0.35);
  }
  .gate-hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6;}

  /* ---------- 앱 레이아웃 ---------- */
  #app{max-width:960px;margin:0 auto;padding:24px 18px 80px;}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  header.top h1{font-size:28px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .code-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:#fff;padding:6px 12px;border-radius:99px;box-shadow:var(--shadow);
  }
  .code-pill button{background:none;color:var(--lilac-dark);font-size:12px;font-weight:700;text-decoration:underline;padding:0;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    background:#fff;border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);text-align:center;min-width:64px;
  }
  .stat b{display:block;font-size:20px;}
  .stat span{font-size:11px;color:var(--muted);}

  .panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px;}
  .search-row{display:flex;gap:8px;flex-wrap:wrap;}
  .search-row input[type=text]{
    flex:1;min-width:180px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);font-size:15px;outline:none;
  }
  .search-row input[type=text]:focus{border-color:var(--peach-dark);}
  .btn{padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;color:#fff;white-space:nowrap;}
  .btn-peach{background:linear-gradient(135deg,var(--peach),var(--peach-dark));box-shadow:0 5px 14px rgba(255,148,89,.35);}
  .btn-lilac{background:linear-gradient(135deg,var(--lilac),var(--lilac-dark));box-shadow:0 5px 14px rgba(142,111,190,.3);}
  .btn-ghost{background:#F5F0F8;color:var(--ink);box-shadow:none;}
  .btn-outline{background:#fff;color:var(--lilac-dark);border:2px solid var(--lilac);box-shadow:none;}
  .btn:disabled{opacity:.5;cursor:default;}

  .search-results{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .result-card{
    display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--cream);
  }
  .result-card img{width:44px;height:62px;object-fit:cover;border-radius:6px;background:#eee;flex-shrink:0;}
  .result-info{flex:1;min-width:0;}
  .result-info .t{font-weight:700;font-size:14px;line-height:1.35;}
  .result-info .m{font-size:12px;color:var(--muted);margin-top:2px;}
  .search-status{font-size:13px;color:var(--muted);padding:6px 2px;}
  .provider-note{font-size:11px;color:var(--lilac-dark);background:#F5F0FA;display:inline-block;padding:5px 12px;border-radius:99px;margin-top:8px;}
  .provider-note.kakao{color:#B8860B;background:#FFF6E0;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{
    padding:9px 16px;border-radius:99px;background:#fff;color:var(--muted);font-size:13px;font-weight:700;
    box-shadow:var(--shadow);
  }
  .tab.active{background:linear-gradient(135deg,var(--lilac),var(--lilac-dark));color:#fff;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;
  }
  .card{
    background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
    transition:transform .15s;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);}
  .cover{
    width:100%;aspect-ratio:3/4.2;background:linear-gradient(160deg,#F3ECFA,#FDEFE4);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .cover img{width:100%;height:100%;object-fit:cover;}
  .cover .ph{font-size:32px;opacity:.5;}
  .card-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
  .card-body .title{font-size:13px;font-weight:700;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-body .author{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{align-self:flex-start;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:2px;}
  .badge.unread{background:#F0EBE0;color:#8A7F6B;}
  .badge.reading{background:linear-gradient(135deg,var(--peach),var(--peach-dark));color:#fff;}
  .badge.done{background:linear-gradient(135deg,var(--lilac),var(--lilac-dark));color:#fff;}
  .mini-progress{height:5px;border-radius:99px;background:#F0E9E2;overflow:hidden;margin-top:2px;}
  .mini-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--peach-dark));}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7;}
  .empty .icon{font-size:40px;margin-bottom:10px;}

  /* ---------- 상세 모달 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(74,63,85,.45);display:flex;align-items:flex-end;justify-content:center;
    z-index:50;padding:0;
  }
  @media (min-width:640px){.overlay{align-items:center;padding:20px;}}
  .modal{
    background:#fff;border-radius:26px 26px 0 0;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;
    padding:26px 22px 30px;
  }
  @media (min-width:640px){.modal{border-radius:26px;}}
  .modal-head{display:flex;gap:14px;margin-bottom:16px;}
  .modal-head .cover{width:80px;height:112px;border-radius:10px;flex-shrink:0;aspect-ratio:auto;}
  .modal-head .cover .ph{font-size:26px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;}
  .field input[type=text],.field input[type=number],.field textarea{
    width:100%;padding:10px 13px;border-radius:12px;border:2px solid var(--line);font-size:14px;outline:none;
  }
  .field input:focus,.field textarea:focus{border-color:var(--lilac);}
  .field textarea{resize:vertical;min-height:60px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:9px 4px;border-radius:12px;background:var(--cream);color:var(--muted);font-size:12px;font-weight:700;}
  .seg button.on{background:linear-gradient(135deg,var(--lilac),var(--lilac-dark));color:#fff;}
  .progress-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .progress-wrap input{width:70px;}
  .progress-wrap .of{font-size:12px;color:var(--muted);white-space:nowrap;}
  .bar{height:8px;border-radius:99px;background:#F0E9E2;overflow:hidden;margin-top:8px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--peach-dark));}
  .stars{display:flex;gap:6px;font-size:26px;}
  .stars span{opacity:.3;transition:opacity .1s;}
  .stars span.on{opacity:1;}
  .modal-actions{display:flex;gap:8px;margin-top:20px;}
  .modal-actions .btn{flex:1;}
  .modal-close{position:sticky;top:0;text-align:right;margin-bottom:-6px;}
  .modal-close button{background:none;color:var(--muted);font-size:22px;padding:4px 8px;}
  .del-link{display:block;text-align:center;margin-top:14px;font-size:12px;color:#C97A7A;text-decoration:underline;background:none;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="icon">📚</div>
    <h1 class="serif">내 서재</h1>
    <p>서재 코드를 입력하면 그 코드로 내 책장이 저장돼.<br>다른 기기에서도 같은 코드를 입력하면 같은 책장이 보여.</p>
    <input type="text" id="codeInput" placeholder="예: seeun2026" autocomplete="off">
    <button class="btn btn-lilac" id="enterBtn" style="width:100%;box-shadow:none;">서재 열기</button>
    <div class="gate-hint">처음이라면 아무 단어나 정해서 입력하면 새 서재가 만들어져요.<br>기억해두면 다음에 같은 코드로 이어서 쓸 수 있어요.</div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div>
      <h1 class="serif">📚 내 서재</h1>
      <div class="code-pill">코드: <b id="codeLabel"></b> · <button id="switchCodeBtn">다른 서재</button></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="panel">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="추가할 책 제목이나 저자로 검색">
      <button class="btn btn-peach" id="searchBtn">검색</button>
      <button class="btn btn-outline" id="manualAddBtn">직접 추가</button>
    </div>
    <div id="searchStatus" class="search-status" hidden></div>
    <div id="searchResults" class="search-results"></div>
    <button class="btn btn-ghost" id="closeResultsBtn" hidden style="margin-top:10px;padding:8px 16px;font-size:12px;">✕ 검색 결과 닫기</button>
    <div id="providerNote" class="provider-note" hidden></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <input type="text" id="filterInput" placeholder="내 서재에서 찾기" style="width:100%;padding:11px 15px;border-radius:14px;border:2px solid var(--line);font-size:14px;outline:none;margin-bottom:16px;">

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" hidden>
    <div class="icon">📖</div>
    아직 담긴 책이 없어요.<br>위에서 책을 검색해 서재에 담아보세요.
  </div>
</div>

<div class="overlay" id="detailOverlay" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const PROXY = 'https://prompt-atelier-proxy.vercel.app';

const firebaseConfig = {
  apiKey: "AIzaSyBtSooSc-eg4zMHQ_QF-ErmYJmtaYT1Fkg",
  authDomain: "limi-88231.firebaseapp.com",
  projectId: "limi-88231",
  storageBucket: "limi-88231.firebasestorage.app",
  messagingSenderId: "361025367626",
  appId: "1:361025367626:web:19d4e19d54558d4a79c0b3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let libraryCode = localStorage.getItem('seni_library_code') || '';
let booksRef = null;
let unsub = null;
let books = [];
let activeTab = 'all';
let filterText = '';

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- 게이트 ----------
document.getElementById('enterBtn').onclick = () => {
  const v = document.getElementById('codeInput').value.trim();
  if (!v) return;
  libraryCode = v;
  localStorage.setItem('seni_library_code', v);
  openLibrary();
};
document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('enterBtn').click();
});
document.getElementById('switchCodeBtn').onclick = () => {
  if (unsub) unsub();
  localStorage.removeItem('seni_library_code');
  libraryCode = '';
  books = [];
  document.getElementById('app').hidden = true;
  document.getElementById('gate').hidden = false;
  document.getElementById('codeInput').value = '';
};

if (libraryCode) openLibrary();

function openLibrary(){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('codeLabel').textContent = libraryCode;
  booksRef = db.collection('book_library').doc(libraryCode).collection('books');
  if (unsub) unsub();
  unsub = booksRef.orderBy('addedAt', 'desc').onSnapshot(snap => {
    books = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => {
    console.error(err);
  });
}

// ---------- 책 검색 (알라딘) ----------
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchStatus = document.getElementById('searchStatus');
const searchResults = document.getElementById('searchResults');

searchBtn.onclick = doSearch;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

const closeResultsBtn = document.getElementById('closeResultsBtn');
closeResultsBtn.onclick = () => {
  searchResults.innerHTML = '';
  searchStatus.hidden = true;
  closeResultsBtn.hidden = true;
};

const providerNote = document.getElementById('providerNote');
function showProviderNote(provider){
  if (provider === 'kakao') {
    providerNote.textContent = '🟡 지금은 카카오 검색 임시 연결 중 — 쪽수는 직접 입력해줘. 알라딘 키가 등록되면 자동 전환돼.';
    providerNote.className = 'provider-note kakao';
  } else if (provider === 'aladin') {
    providerNote.textContent = '🟣 알라딘 검색 연결됨 — 쪽수까지 자동으로 채워져.';
    providerNote.className = 'provider-note';
  } else {
    return;
  }
  providerNote.hidden = false;
}

async function doSearch(){
  const q = searchInput.value.trim();
  if (!q) return;
  searchResults.innerHTML = '';
  searchStatus.hidden = false;
  searchStatus.textContent = '검색하는 중...';
  closeResultsBtn.hidden = true;
  searchBtn.disabled = true;
  try {
    const r = await fetch(`${PROXY}/api/book-search?action=search&query=${encodeURIComponent(q)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '검색 실패');
    showProviderNote(data.provider);
    if (!data.items || !data.items.length) {
      searchStatus.textContent = '검색 결과가 없어요. 직접 추가를 이용해보세요.';
      closeResultsBtn.hidden = false;
      return;
    }
    searchStatus.hidden = true;
    closeResultsBtn.hidden = false;
    searchResults.innerHTML = data.items.map((it, i) => `
      <div class="result-card">
        <img src="${esc(it.cover)}" onerror="this.style.visibility='hidden'">
        <div class="result-info">
          <div class="t">${esc(it.title)}</div>
          <div class="m">${esc(it.author)} · ${esc(it.publisher)} ${it.pubDate ? '· ' + esc(it.pubDate.slice(0,4)) : ''}</div>
        </div>
        <button class="btn btn-lilac" style="padding:8px 12px;font-size:12px;" data-i="${i}">담기</button>
      </div>
    `).join('');
    searchResults.querySelectorAll('button[data-i]').forEach(btn => {
      btn.onclick = () => addFromSearch(data.items[+btn.dataset.i], btn);
    });
  } catch (err) {
    searchStatus.hidden = false;
    searchStatus.textContent = '검색에 실패했어요: ' + err.message;
    closeResultsBtn.hidden = false;
  } finally {
    searchBtn.disabled = false;
  }
}

async function addFromSearch(item, btn){
  btn.disabled = true;
  btn.textContent = '담는 중';
  let pageCount = item.pageCount || null;
  let cover = item.cover || '';
  if (item.isbn13) {
    try {
      const r = await fetch(`${PROXY}/api/book-search?action=lookup&isbn=${encodeURIComponent(item.isbn13)}`);
      const data = await r.json();
      if (data.items && data.items[0]) {
        pageCount = data.items[0].pageCount || pageCount;
        cover = data.items[0].cover || cover;
      }
    } catch (e) { /* 상세 조회 실패해도 검색 결과 정보로 계속 진행 */ }
  }
  await booksRef.add({
    title: item.title, author: item.author, publisher: item.publisher, pubDate: item.pubDate || '',
    isbn13: item.isbn13 || '', cover, pageCount: pageCount || null,
    status: 'unread', currentPage: 0, rating: null, memo: '',
    addedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    finishedAt: null
  });
  btn.textContent = '담김 ✓';
}

// ---------- 직접 추가 ----------
document.getElementById('manualAddBtn').onclick = () => {
  openDetail(null);
};

// ---------- 탭 / 필터 ----------
const TABS = [
  { key: 'all', label: '전체' },
  { key: 'unread', label: '안읽음' },
  { key: 'reading', label: '읽는 중' },
  { key: 'done', label: '다읽음' },
];
document.getElementById('filterInput').addEventListener('input', e => {
  filterText = e.target.value.trim().toLowerCase();
  render();
});

function render(){
  const counts = { all: books.length, unread: 0, reading: 0, done: 0 };
  books.forEach(b => { if (counts[b.status] !== undefined) counts[b.status]++; });

  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${counts.all}</b><span>전체</span></div>
    <div class="stat"><b>${counts.done}</b><span>다읽음</span></div>
    <div class="stat"><b>${counts.reading}</b><span>읽는 중</span></div>
  `;

  document.getElementById('tabs').innerHTML = TABS.map(t => `
    <button class="tab ${activeTab === t.key ? 'active' : ''}" data-tab="${t.key}">${t.label} ${counts[t.key]}</button>
  `).join('');
  document.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { activeTab = el.dataset.tab; render(); };
  });

  let list = activeTab === 'all' ? books : books.filter(b => b.status === activeTab);
  if (filterText) {
    list = list.filter(b => (b.title || '').toLowerCase().includes(filterText) || (b.author || '').toLowerCase().includes(filterText));
  }

  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if (!list.length) {
    grid.innerHTML = '';
    empty.hidden = false;
  } else {
    empty.hidden = true;
    grid.innerHTML = list.map(b => {
      const badgeText = b.status === 'unread' ? '안읽음' : b.status === 'reading' ? '읽는 중' : '다읽음';
      const pct = (b.pageCount && b.status === 'reading') ? Math.min(100, Math.round((b.currentPage||0) / b.pageCount * 100)) : null;
      return `
      <div class="card" data-id="${b.id}">
        <div class="cover">
          ${b.cover ? `<img src="${esc(b.cover)}" onerror="this.parentElement.innerHTML='<span class=ph>📖</span>'">` : '<span class="ph">📖</span>'}
        </div>
        <div class="card-body">
          <div class="title">${esc(b.title)}</div>
          <div class="author">${esc(b.author)}</div>
          <span class="badge ${b.status}">${badgeText}${b.status==='done' && b.rating ? ' ' + '★'.repeat(b.rating) : ''}</span>
          ${pct !== null ? `<div class="mini-progress"><i style="width:${pct}%"></i></div>` : ''}
        </div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.card').forEach(el => {
      el.onclick = () => openDetail(books.find(b => b.id === el.dataset.id));
    });
  }
}

// ---------- 상세 모달 ----------
const overlay = document.getElementById('detailOverlay');
let editState = null;

function openDetail(book){
  editState = book ? { ...book } : {
    id: null, title: '', author: '', publisher: '', pageCount: null, cover: '',
    status: 'unread', currentPage: 0, rating: null, memo: ''
  };
  drawDetail();
  overlay.hidden = false;
}
function closeDetail(){ overlay.hidden = true; editState = null; }
overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });

function drawDetail(){
  const b = editState;
  const statusLabel = { unread: '안읽음', reading: '읽는 중', done: '다읽음' };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-close"><button id="closeBtn">✕</button></div>
      <div class="modal-head">
        <div class="cover">${b.cover ? `<img src="${esc(b.cover)}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;" onerror="this.parentElement.innerHTML='<span class=ph>📖</span>'">` : '<span class="ph">📖</span>'}</div>
        <div style="flex:1;">
          <div class="field" style="margin-bottom:8px;"><input type="text" id="f-title" value="${esc(b.title)}" placeholder="책 제목"></div>
          <div class="field" style="margin-bottom:0;"><input type="text" id="f-author" value="${esc(b.author)}" placeholder="저자"></div>
        </div>
      </div>
      <div class="field">
        <label>출판사 / 쪽수</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="f-publisher" value="${esc(b.publisher||'')}" placeholder="출판사" style="flex:1;">
          <input type="number" id="f-pageCount" value="${b.pageCount||''}" placeholder="쪽수" style="width:90px;">
        </div>
      </div>
      <div class="field">
        <label>읽음 상태</label>
        <div class="seg" id="statusSeg">
          ${['unread','reading','done'].map(s => `<button data-s="${s}" class="${b.status===s?'on':''}">${statusLabel[s]}</button>`).join('')}
        </div>
      </div>
      <div class="field" id="progressField" ${b.status !== 'reading' ? 'hidden' : ''}>
        <label>진도</label>
        <div class="progress-wrap">
          <input type="number" id="f-currentPage" value="${b.currentPage||0}" min="0">
          <span class="of">/ ${b.pageCount ? b.pageCount + '쪽' : '쪽수 미입력'}</span>
        </div>
        <div class="bar"><i id="progressBar" style="width:${b.pageCount ? Math.min(100, Math.round((b.currentPage||0)/b.pageCount*100)) : 0}%"></i></div>
      </div>
      <div class="field" id="ratingField" ${b.status !== 'done' ? 'hidden' : ''}>
        <label>별점</label>
        <div class="stars" id="stars">
          ${[1,2,3,4,5].map(n => `<span data-n="${n}" class="${b.rating >= n ? 'on' : ''}">★</span>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>메모</label>
        <textarea id="f-memo" placeholder="한 줄 감상, 인상 깊은 구절...">${esc(b.memo||'')}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">닫기</button>
        <button class="btn btn-lilac" id="saveBtn">저장</button>
      </div>
      ${b.id ? '<button class="del-link" id="delBtn">이 책 서재에서 지우기</button>' : ''}
    </div>
  `;

  document.getElementById('closeBtn').onclick = closeDetail;
  document.getElementById('cancelBtn').onclick = closeDetail;

  document.querySelectorAll('#statusSeg button').forEach(btn => {
    btn.onclick = () => {
      editState.status = btn.dataset.s;
      drawDetail();
    };
  });
  document.getElementById('f-currentPage')?.addEventListener('input', e => {
    editState.currentPage = +e.target.value;
    const pc = +(document.getElementById('f-pageCount').value || 0);
    const pct = pc ? Math.min(100, Math.round(editState.currentPage / pc * 100)) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
  });
  document.querySelectorAll('#stars span').forEach(s => {
    s.onclick = () => {
      editState.rating = +s.dataset.n;
      drawDetail();
    };
  });
  const delBtn = document.getElementById('delBtn');
  if (delBtn) delBtn.onclick = async () => {
    if (!confirm('정말 이 책을 서재에서 지울까요?')) return;
    await booksRef.doc(editState.id).delete();
    closeDetail();
  };

  document.getElementById('saveBtn').onclick = async () => {
    const payload = {
      title: document.getElementById('f-title').value.trim() || '제목 없음',
      author: document.getElementById('f-author').value.trim(),
      publisher: document.getElementById('f-publisher').value.trim(),
      pageCount: document.getElementById('f-pageCount').value ? +document.getElementById('f-pageCount').value : null,
      status: editState.status,
      currentPage: editState.status === 'reading' ? (+document.getElementById('f-currentPage').value || 0) : (editState.currentPage||0),
      rating: editState.status === 'done' ? (editState.rating || null) : null,
      memo: document.getElementById('f-memo').value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    if (editState.status === 'done' && !editState.finishedAt) {
      payload.finishedAt = firebase.firestore.FieldValue.serverTimestamp();
    }
    if (editState.id) {
      await booksRef.doc(editState.id).update(payload);
    } else {
      payload.cover = '';
      payload.isbn13 = '';
      payload.finishedAt = payload.finishedAt || null;
      payload.addedAt = firebase.firestore.FieldValue.serverTimestamp();
      await booksRef.add(payload);
    }
    closeDetail();
  };
}
</script>
</body>
</html>
